spring.application.name=sb-ecom

# Server configuration
server.port=${PORT:8080}

# PostgreSQL database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Image configuration
project.image=images/
image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images}

# JWT configuration
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:3000000}
spring.ecom.app.jwtCookieName=springBootEcom

# Frontend and CORS
frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Stripe
stripe.secret.key=${STRIPE_SECRET_KEY}

# Optional SQL logging for local debugging
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
